plugins { id 'com.android.application' }
android {
    namespace 'com.bimcc.headscaleclient'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bimcc.headscaleclient.preview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.1-android.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/preview-icons')
}
tasks.register('copyPreviewIcon', Copy) {
    from "${rootDir}/../../build/appicon.png"
    into layout.buildDirectory.dir('generated/preview-icons/drawable-nodpi')
    rename 'appicon.png', 'ic_launcher.png'
}
tasks.named('preBuild') { dependsOn 'copyPreviewIcon' }
dependencies {
    implementation files('libs/engine.aar')
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
