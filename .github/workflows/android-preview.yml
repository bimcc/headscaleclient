name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [codex/android-preview]
    paths: ['mobile/**', 'internal/**', 'frontend/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - name: Build shared UI and test mobile boundary
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend test
          pnpm --dir frontend build
          cd mobile
          go test ./bridge
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Restore embedded core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/android/app/libs/engine.aar
          key: android-core-ndk28-go1265-${{ hashFiles('go.mod', 'go.sum', 'internal/**/*.go', 'mobile/go.*', 'mobile/engine/**', 'mobile/bridge/**', 'mobile/android/build-preview.sh') }}
      - name: Build APK with embedded network core
        env:
          USE_CACHED_CORE: ${{ steps.core-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          HEADSCALE_ANDROID_KEYSTORE_BASE64: ${{ secrets.HEADSCALE_ANDROID_KEYSTORE_BASE64 }}
          HEADSCALE_ANDROID_KEY_PASSWORD: ${{ secrets.HEADSCALE_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$HEADSCALE_ANDROID_KEYSTORE_BASE64" && test -n "$HEADSCALE_ANDROID_KEY_PASSWORD"
          export HEADSCALE_ANDROID_KEYSTORE="$RUNNER_TEMP/headscaleclient.p12"
          umask 077
          printf '%s' "$HEADSCALE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HEADSCALE_ANDROID_KEYSTORE"
          echo "HEADSCALE_ANDROID_KEYSTORE=$HEADSCALE_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
          bash mobile/android/build-preview.sh
      - name: Cache compiled core even when Java or lint fails
        if: always() && steps.core-cache.outputs.cache-hit != 'true' && hashFiles('mobile/android/app/libs/engine.aar') != ''
        uses: actions/cache/save@v4
        with:
          path: mobile/android/app/libs/engine.aar
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify embedded core and Activity lifecycle on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HEADSCALE_ANDROID_KEY_PASSWORD: ${{ secrets.HEADSCALE_ANDROID_KEY_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/android/verify-emulator.sh
      - name: Upload preview and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headscaleclient-android-preview
          path: |
            bin/android-preview/
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/headscaleclient.p12"
