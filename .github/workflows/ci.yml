name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"
  WAILS_VERSION: "v3.0.0-beta.23"
  TAILSCALE_VERSION: "v1.102.2"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install pinned Wails CLI
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$goBin$([IO.Path]::PathSeparator)$env:PATH"
          wails3 version

      - name: Download Go modules
        run: go mod download

      - name: Verify application version consistency
        run: node tools/build/check-version.mjs

      - name: Verify pinned toolchain and Go modules
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          function Assert-Equal([string]$Name, [string]$Actual, [string]$Expected) {
            if ($Actual -ne $Expected) {
              throw "$Name version mismatch: expected $Expected, got $Actual"
            }
          }

          Assert-Equal "Go" (go env GOVERSION).Trim() "go$env:GO_VERSION"
          $nodeVersion = (node --version).Trim()
          if (-not $nodeVersion.StartsWith("v$($env:NODE_VERSION).")) {
            throw "Node.js major version mismatch: expected $env:NODE_VERSION, got $nodeVersion"
          }
          Assert-Equal "pnpm" (pnpm --version).Trim() $env:PNPM_VERSION
          Assert-Equal "Wails module" (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim() $env:WAILS_VERSION
          Assert-Equal "tailscale.com" (go list -m -f '{{.Version}}' tailscale.com).Trim() $env:TAILSCALE_VERSION
          go mod verify

      - name: Generate Wails bindings
        run: go tool wails3 generate bindings -clean=true -ts -i

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build desktop application
        run: go tool wails3 build

      - name: Verify compiled Windows version resource
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $info = (Get-Item bin/headscaleclient.exe).VersionInfo
          if ($info.FileVersion -ne $expectedVersion -or $info.ProductVersion -ne $expectedVersion -or
              $info.FileVersionRaw.ToString() -ne "$expectedVersion.0" -or
              $info.ProductVersionRaw.ToString() -ne "$expectedVersion.0" -or
              $info.CompanyName -ne 'BIMCC., Ltd.' -or $info.ProductName -ne 'HeadscaleClient') {
            throw "The built Windows executable has incomplete or incorrect version information: $info"
          }

      - name: Verify service-bearing Linux package
        if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go tool wails3 task linux:prepare:daemon ARCH=amd64
          go tool wails3 task linux:generate:deb ARCH=amd64
          $package = Get-ChildItem -Path bin -Filter '*.deb' | Select-Object -First 1
          if ($null -eq $package) {
            throw "The Linux DEB package was not generated."
          }
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $packageVersion = (dpkg-deb --field $package.FullName Version).Trim()
          if ($packageVersion -ne "$expectedVersion-1") {
            throw "Unexpected DEB version: $packageVersion"
          }
          $contents = dpkg-deb --contents $package.FullName | Out-String
          @(
            'usr/bin/headscaleclient',
            'usr/lib/headscaleclient/daemon/tailscaled',
            'usr/lib/systemd/system/headscaleclient-tailscaled.service',
            'usr/share/doc/headscaleclient/daemon/provenance.json'
          ) | ForEach-Object {
            if (-not $contents.Contains($_)) {
              throw "The Linux package is missing $_."
            }
          }

      - name: Upload verified Linux DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: headscaleclient-linux-amd64
          if-no-files-found: error
          path: bin/*.deb
          retention-days: 30
