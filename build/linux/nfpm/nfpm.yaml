# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "headscaleclient"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: "HeadscaleClient Contributors <headscaleclient@users.noreply.github.com>"
description: "Cross-platform client for Tailscale-compatible networks"
vendor: "HeadscaleClient Contributors"
homepage: "https://github.com/headscaleclient/headscaleclient"
license: "MIT"
release: "1"

contents:
  - src: "./bin/headscaleclient"
    dst: "/usr/bin/headscaleclient"
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: "./bin/daemon/linux-${GOARCH}/tailscaled"
    dst: "/usr/lib/headscaleclient/daemon/tailscaled"
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: "./bin/daemon/linux-${GOARCH}/tailscale"
    dst: "/usr/lib/headscaleclient/daemon/tailscale"
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: "./bin/daemon/linux-${GOARCH}/provenance.json"
    dst: "/usr/share/doc/headscaleclient/daemon/provenance.json"
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: "./bin/daemon/linux-${GOARCH}/licenses/TAILSCALE-LICENSE.txt"
    dst: "/usr/share/doc/headscaleclient/daemon/TAILSCALE-LICENSE.txt"
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: "./build/linux/systemd/headscaleclient-tailscaled.service"
    dst: "/usr/lib/systemd/system/headscaleclient-tailscaled.service"
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/headscaleclient.png"
  - src: "./build/linux/headscaleclient.desktop"
    dst: "/usr/share/applications/headscaleclient.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - iproute2
  - iptables
  - policykit-1
  - systemd

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - iproute
      - iptables
      - polkit
      - systemd

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkit2gtk-6.0
      - iproute2
      - iptables
      - polkit
      - systemd

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
